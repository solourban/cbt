name: Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  static-build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run scoring tests
        run: npm run test:scoring

      - name: Check merge selection
        run: npm run check:merge-selection

      - name: Build static app
        run: npm run build

      - name: Verify static build output
        run: npm run check:static-build
